<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>コンピュータウィルス撲滅大作戦☆</title>
    <style>
        :root { --bg-color: #0b1d3a; --neon-green: #00ff66; --neon-red: #ff3333; --neon-yellow: #ffcc00; --white: #f0f0f0; }
        body { 
            font-family: 'Courier New', monospace; 
            background-color: var(--bg-color); 
            color: var(--white); 
            text-align: center; 
            margin: 0; 
            padding: 20px; 
            touch-action: manipulation;
        }
        
        /* 左上のストーリー進行度POP */
        .story-pop {
            position: fixed;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.85);
            border: 2px dashed var(--neon-green);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            color: var(--neon-green);
            text-align: left;
            z-index: 100;
        }
        .story-pop strong { color: #fff; font-size: 0.9rem; }

        /* 右上の強化ボタン・コイン表示 */
        .shop-pop {
            position: fixed;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid var(--neon-yellow);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            color: var(--neon-yellow);
            text-align: right;
            z-index: 100;
        }
        .shop-btn {
            background: var(--neon-yellow);
            color: #000;
            border: none;
            padding: 5px 10px;
            font-size: 0.75rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 5px;
        }

        .container { max-width: 600px; margin: 0 auto; background: rgba(0, 0, 0, 0.6); padding: 25px; border-radius: 15px; border: 2px solid var(--neon-green); box-shadow: 0 0 15px rgba(0,255,102,0.3); margin-top: 50px; }
        h1 { color: var(--neon-green); font-size: 1.4rem; text-shadow: 0 0 10px rgba(0,255,102,0.5); }
        
        .status-box { background: rgba(0,0,0,0.8); padding: 10px; border-radius: 8px; margin: 15px 0; border: 1px solid #444; font-size: 0.9rem; }
        .battle-area { background: rgba(255,255,255,0.05); padding: 20px; border-radius: 10px; margin: 20px 0; min-height: 140px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        
        /* 巨大化したメインボタン */
        .big-attack-btn { 
            background: var(--neon-green); 
            color: #000; 
            border: none; 
            padding: 22px 40px; 
            font-size: 1.3rem; 
            font-weight: bold; 
            border-radius: 12px; 
            cursor: pointer; 
            transition: 0.1s; 
            margin: 10px 0; 
            box-shadow: 0 0 15px rgba(0,255,102,0.4);
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .big-attack-btn:active { transform: scale(0.95); background: #fff; }

        .btn-reset { background: #ff3333; color: #fff; font-size: 0.8rem; padding: 8px 15px; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; }
        .btn-retry { background: #ffcc00; color: #000; font-size: 0.9rem; font-weight: bold; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; display: none; margin: 10px auto; }

        /* ボス戦用UI */
        #boss-ui { display: none; margin-bottom: 10px; color: var(--neon-red); font-weight: bold; font-size: 0.9rem; width: 100%; }
        .boss-hp-bar { width: 100%; max-width: 300px; height: 14px; background: #333; border: 1px solid var(--neon-red); border-radius: 5px; overflow: hidden; margin: 5px auto; }
        .boss-hp-fill { width: 100%; height: 100%; background: var(--neon-red); transition: width 0.1s; }

        /* ストーリー用オーバーレイ */
        #story-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.96);
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.8s ease;
            padding: 20px;
            box-sizing: border-box;
        }
        .story-text-box {
            max-width: 500px;
            padding: 25px;
            font-size: 1.1rem;
            color: var(--neon-red);
            border: 1px dashed var(--neon-red);
            background: rgba(20, 0, 0, 0.7);
            min-height: 4em;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            line-height: 1.6;
            text-shadow: 0 0 8px rgba(255,51,51,0.6);
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <!-- 左上：ストーリー進行度POP -->
    <div class="story-pop">
        📜 次の目標:<br>
        <strong id="next-goal-text">30体 (イベント)</strong>
    </div>

    <!-- 右上：コイン＆強化ショップ -->
    <div class="shop-pop" id="shop-container" style="display: none;">
        🪙 コイン: <span id="coin-count">0</span><br>
        ⚔️ 攻撃力: <span id="atk-power">1</span><br>
        <button class="shop-btn" onclick="upgradeAtk()">攻撃強化 (150🪙)</button>
    </div>

    <div class="container">
        <h1>💻 コンピュータウィルス撲滅大作戦☆</h1>
        <div class="status-box">
            <div>累計撃破数: <strong id="kill-count">0</strong> / 5,000 体</div>
        </div>

        <div class="battle-area">
            <!-- ボス戦UI -->
            <div id="boss-ui">
                ⚠️ <span id="boss-name-title">中ボス交戦中</span>！<br>
                残り時間: <span id="timer-display">30</span>秒 | HP: <span id="boss-hp">50</span> / <span id="boss-max-hp">50</span>
                <div class="boss-hp-bar"><div class="boss-hp-fill" id="boss-hp-fill"></div></div>
            </div>

            <div id="enemy-display" style="font-size: 1.5rem; margin-bottom: 5px;">🦠 ウィルス戦</div>
            
            <!-- 巨大メインボタン -->
            <button class="big-attack-btn" id="action-btn" onclick="attackVirus()">ウィルスを駆除する！</button>
            
            <!-- 負けた時の救済ボタン -->
            <button class="btn-retry" id="retry-btn" onclick="retryFrom30()">🔄 30体前に戻って再挑戦する</button>
        </div>
        
        <div id="message" style="color: #00ff66; font-weight: bold; font-size: 0.9rem;">PCを守るため、ウィルスを叩け！</div>

        <button class="btn-reset" onclick="resetData()">データを初期化（リセット）</button>
    </div>

    <!-- ストーリー用オーバーレイ -->
    <div id="story-overlay">
        <div style="font-size: 0.85rem; color: #888; margin-bottom: 15px; letter-spacing: 2px;">ーーー 通信傍受中 ーーー</div>
        <div class="story-text-box" id="story-text">...</div>
    </div>

    <script>
        let killCount = parseInt(localStorage.getItem('virus_kill_count')) || 0;
        let coins = parseInt(localStorage.getItem('virus_coins')) || 0;
        let attackPower = parseInt(localStorage.getItem('virus_atk')) || 1;
        let storyProgress = parseInt(localStorage.getItem('virus_story_prog')) || 0; 
        
        let isBossActive = localStorage.getItem('virus_boss_active') === 'true';
        let currentBossId = parseInt(localStorage.getItem('virus_current_boss')) || 50;
        let bossHp = parseInt(localStorage.getItem('virus_boss_hp')) || 50;
        let bossMaxHp = parseInt(localStorage.getItem('virus_boss_max_hp')) || 50;
        
        let isStoryPlaying = false;
        let timeLeft = 30;
        let bossTimer = null;
        let showRetryButtonFlag = false;

        const killCountEl = document.getElementById('kill-count');
        const nextGoalTextEl = document.getElementById('next-goal-text');
        const messageEl = document.getElementById('message');
        const storyOverlay = document.getElementById('story-overlay');
        const storyTextEl = document.getElementById('story-text');
        const enemyDisplayEl = document.getElementById('enemy-display');
        
        const shopContainerEl = document.getElementById('shop-container');
        const coinCountEl = document.getElementById('coin-count');
        const atkPowerEl = document.getElementById('atk-power');
        const retryBtnEl = document.getElementById('retry-btn');
        
        const bossUiEl = document.getElementById('boss-ui');
        const bossNameTitleEl = document.getElementById('boss-name-title');
        const bossHpEl = document.getElementById('boss-hp');
        const bossMaxHpEl = document.getElementById('boss-max-hp');
        const bossHpFillEl = document.getElementById('boss-hp-fill');
        const timerDisplayEl = document.getElementById('timer-display');

        function updateDisplay() {
            killCountEl.textContent = killCount;
            coinCountEl.textContent = coins;
            atkPowerEl.textContent = attackPower;

            if (storyProgress >= 2) {
                shopContainerEl.style.display = 'block';
            } else {
                shopContainerEl.style.display = 'none';
            }

            if (killCount < 30) {
                nextGoalTextEl.textContent = "30体 (最初のイベント)";
            } else if (killCount < 50) {
                nextGoalTextEl.textContent = "50体 (トロイの木犬)";
            } else if (killCount < 100) {
                nextGoalTextEl.textContent = "100体 (フィッシュ・イング)";
            } else if (killCount < 300) {
                nextGoalTextEl.textContent = "300体 (ウシロ・ドア)";
            } else if (killCount < 500) {
                nextGoalTextEl.textContent = "500体 (レグナ)";
            } else if (killCount < 1000) {
                nextGoalTextEl.textContent = "1000体 (ゼクス)";
            } else if (killCount < 2000) {
                nextGoalTextEl.textContent = "2000体 (キロガ)";
            } else if (killCount < 2500) {
                nextGoalTextEl.textContent = "2500体 (ノクス)";
            } else if (killCount < 3000) {
                nextGoalTextEl.textContent = "3000体 (リアル=モニトハック)";
            } else {
                nextGoalTextEl.textContent = "平和なPC環境";
            }

            if (isBossActive) {
                bossHpEl.textContent = bossHp;
                bossMaxHpEl.textContent = bossMaxHp;
                bossHpFillEl.style.width = Math.max(0, (bossHp / bossMaxHp * 100)) + '%';
            }

            if (showRetryButtonFlag) {
                retryBtnEl.style.display = 'block';
            } else {
                retryBtnEl.style.display = 'none';
            }
        }

        function saveGame() {
            localStorage.setItem('virus_kill_count', killCount);
            localStorage.setItem('virus_coins', coins);
            localStorage.setItem('virus_atk', attackPower);
            localStorage.setItem('virus_story_prog', storyProgress);
            localStorage.setItem('virus_boss_active', isBossActive);
            localStorage.setItem('virus_current_boss', currentBossId);
            localStorage.setItem('virus_boss_hp', bossHp);
            localStorage.setItem('virus_boss_max_hp', bossMaxHp);
        }

        if (isBossActive) {
            startBossBattle(currentBossId, bossMaxHp, true);
        } else {
            updateEnvironmentDisplay();
        }
        updateDisplay();

        function updateEnvironmentDisplay() {
            if (killCount >= 3000) {
                enemyDisplayEl.innerHTML = "🦠 ウィルス戦 (最終防衛)";
            } else if (killCount >= 2500) {
                enemyDisplayEl.innerHTML = "🦠 ウィルス戦 (ノクス戦後)";
            } else if (killCount >= 2000) {
                enemyDisplayEl.innerHTML = "🦠 ウィルス戦 (キロガ戦後)";
            } else if (killCount >= 1000) {
                enemyDisplayEl.innerHTML = "🦠 ウィルス戦 (ゼクス戦後)";
            } else if (killCount >= 750) {
                enemyDisplayEl.innerHTML = "🦠 ウィルス戦 (ゼクス接近)";
            } else if (killCount >= 500) {
                enemyDisplayEl.innerHTML = "🦠 ウィルス戦 (レグナ接近)";
            } else if (killCount >= 300) {
                enemyDisplayEl.innerHTML = "🦠 ウィルス戦 (ウシロ・ドア戦後)";
            } else if (killCount >= 100) {
                enemyDisplayEl.innerHTML = "🦠 ウィルス戦 (フィッシュ・イング戦後)";
            } else if (killCount >= 50) {
                enemyDisplayEl.innerHTML = "🦠 ウィルス戦 (トロイの木犬戦後)";
            } else {
                enemyDisplayEl.innerHTML = "🦠 ウィルス戦";
            }
        }

        function attackVirus() {
            if (isStoryPlaying) return;

            if (isBossActive) {
                bossHp -= attackPower;
                updateDisplay();
                saveGame();

                if (bossHp <= 0) {
                    defeatBoss(currentBossId);
                }
            } else {
                killCount++;
                
                if (storyProgress >= 2) {
                    coins += 1;
                }

                updateDisplay();
                saveGame();
                messageEl.textContent = `ウィルスを駆除した！ (残り ${5000 - killCount}体)`;

                // 各種イベント・ボス発生判定
                if (killCount === 30 && storyProgress < 1) {
                    storyProgress = 1;
                    saveGame();
                    triggerStory([
                        "トロイ: このPCにセキュリティソフトが来たようだな",
                        "アゼル: どうせ大したことない雑魚ですよ",
                        "アゼル: 中ボスの「トロイの木犬」を向かわせます",
                        "トロイ: それで十分だろう、早速実行に移れ"
                    ]);
                }
                else if (killCount === 50 && storyProgress < 2) {
                    startBossBattle(50, 50, false);
                }
                else if (killCount === 100 && storyProgress < 3) {
                    startBossBattle(100, 100, false);
                }
                else if (killCount === 300 && storyProgress < 4) {
                    startBossBattle(300, 300, false);
                }
                else if (killCount === 500 && storyProgress < 5) {
                    startBossBattle(500, 300, false);
                }
                else if (killCount === 1000 && storyProgress < 7) {
                    startBossBattle(1000, 500, false);
                }
                else if (killCount === 2000 && storyProgress < 9) {
                    startBossBattle(2000, 4000, false);
                }
                else if (killCount === 2500 && storyProgress < 10) {
                    startBossBattle(2500, 6000, false);
                }
                else if (killCount === 3000 && storyProgress < 11) {
                    startBossBattle(3000, 8000, false);
                }

                if (killCount === 750 && storyProgress === 5) {
                    storyProgress = 6;
                    saveGame();
                    triggerStory([
                        "アゼル: ゼクス来てくれ",
                        "ゼクス: ああ、アゼルじゃないか、どうした？",
                        "アゼル: 最近のトロイ様、セキュリティソフトのせいでイライラしてないか？",
                        "ゼクス: トロイ様を落ち着けるために、俺がセキュリティ野郎を倒してくる",
                        "アゼル: 絶対倒して戻ってこいよ"
                    ]);
                }
                else if (killCount === 1500 && storyProgress === 7) {
                    storyProgress = 8;
                    saveGame();
                    triggerStory([
                        "ノクス: あら、アゼルどうしたの？",
                        "アゼル: トロイから逃げないか？あんなクズに従っていたら命が持たない",
                        "ノクス: あら、録音したわよ、これをトロイ様に見せようかしらねぇ...",
                        "アゼル: 裏切ったのか？",
                        "ノクス: あんたなんてタダの仕事仲間よ、こんな密告で報酬が貰えるなんて都合のいい話だわ♪",
                        "アゼル: もう...やめてくれ",
                        "ノクス: ではセキュリティ野郎も倒して手柄を上げて、報酬を貰おうかしらね、行きなさい、キロガ"
                    ]);
                }

                // 通常ザコを倒した時も、区切りごとに表示を更新する
                updateEnvironmentDisplay();
            }
        }

        function upgradeAtk() {
            if (coins >= 150) {
                coins -= 150;
                attackPower += 1;
                updateDisplay();
                saveGame();
                messageEl.textContent = `✨ 攻撃力が上がった！ 現在の攻撃力: ${attackPower}`;
            } else {
                messageEl.textContent = "⚠️ コインが足りません！（必要: 150🪙）";
            }
        }

        function startBossBattle(bossId, maxHp, isResuming) {
            isBossActive = true;
            currentBossId = bossId;
            bossMaxHp = maxHp;
            
            let bossNames = { 
                50: "トロイの木犬", 
                100: "フィッシュ・イング", 
                300: "ウシロ・ドア", 
                500: "レグナ", 
                1000: "ゼクス", 
                2000: "キロガ", 
                2500: "ノクス", 
                3000: "リアル=モニトハック" 
            };
            bossNameTitleEl.textContent = bossNames[bossId] || "ボス";
            enemyDisplayEl.innerHTML = `🔥 ボス戦：${bossNames[bossId]}`;
            
            bossUiEl.style.display = 'block';
            messageEl.innerHTML = `⚠️ 30秒以内にボスを叩き潰せ！！`;

            if (!isResuming) {
                timeLeft = 30;
                bossHp = maxHp;
            }

            saveGame();
            updateDisplay();

            clearInterval(bossTimer);
            bossTimer = setInterval(() => {
                timeLeft--;
                timerDisplayEl.textContent = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(bossTimer);
                    bossUiEl.style.display = 'none';
                    isBossActive = false;
                    saveGame();
                    
                    messageEl.innerHTML = "❌ タイムアップ……！ボスに敗北した……";
                    showRetryButtonFlag = true;
                    updateDisplay();
                }
            }, 1000);
        }

        function retryFrom30() {
            alert("負けたので30体巻き戻します\n\nコインを稼いで、強化してリベンジしよう！");

            showRetryButtonFlag = false;
            killCount = Math.max(0, killCount - 30);
            bossHp = bossMaxHp;
            isBossActive = false;
            saveGame();
            updateEnvironmentDisplay();
            updateDisplay();
            messageEl.innerHTML = "🔄 30体前に戻って体制を立て直した！再挑戦だ！";
        }

        function defeatBoss(bossId) {
            clearInterval(bossTimer);
            isBossActive = false;
            bossUiEl.style.display = 'none';
            showRetryButtonFlag = false;

            if (bossId === 50) {
                storyProgress = 2;
                killCount = 50;
                saveGame();
                updateEnvironmentDisplay();
                triggerStory([
                    "アゼル: トロイさま、トロイの木犬がやられました",
                    "トロイ: なかなかやるな、おい！レグナ出てこい",
                    "レグナ: トロイさま、次はフィッシュ・イングを向かわせましょう",
                    "トロイ: 向かわせろ"
                ]);
            } 
            else if (bossId === 100) {
                storyProgress = 3;
                killCount = 100;
                saveGame();
                updateEnvironmentDisplay();
                triggerStory([
                    "アゼル: え？フィッシュ・イングもやられたんですが...",
                    "トロイ: もういいレグナ、自らいけ",
                    "レグナ: ウシロ・ドアを向かわせます",
                    "トロイ: 次はないからな"
                ]);
            }
            else if (bossId === 300) {
                storyProgress = 4;
                killCount = 300;
                saveGame();
                updateEnvironmentDisplay();
                triggerStory([
                    "レグナ: 行ってきますトロイ様",
                    "トロイ: 必ず倒してこい"
                ]);
            }
            else if (bossId === 500) {
                storyProgress = 5;
                killCount = 500;
                saveGame();
                updateEnvironmentDisplay();
                triggerStory([
                    "トロイ: レグナがやられたか",
                    "アゼル: 悲しいです、トロイ様",
                    "トロイ: 悲しい？そんな事考えずに働け",
                    "アゼル: ..."
                ]);
            }
            else if (bossId === 1000) {
                storyProgress = 7;
                killCount = 1000;
                saveGame();
                updateEnvironmentDisplay();
                triggerStory([
                    "アゼル: ゼクス...嘘だよな",
                    "トロイ: どうした？あの役たたずは死んだが",
                    "アゼル: 取り消せ、今の言葉",
                    "トロイ: なんだ？四天王ごときが口答えか？消してやろうか？ああん？",
                    "アゼル: すみません、なにやらプログラムがバグっていたようです..."
                ]);
            }
            else if (bossId === 2000) {
                storyProgress = 9;
                killCount = 2000;
                saveGame();
                updateEnvironmentDisplay();
                triggerStory([
                    "ノクス: あら、キロガやられたのね、私自ら行くとしますか...",
                    "アゼル: そのまま死ね"
                ]);
            }
            else if (bossId === 2500) {
                storyProgress = 10;
                killCount = 2500;
                saveGame();
                updateEnvironmentDisplay();
                triggerStory([
                    "アゼル: ハハ、死んだな、死んだな死んだ死んだ死んだ死んだ",
                    "トロイ: アゼル、なにか嫌なことでもあったか？",
                    "アゼル: 黙れ寄生しないと動けもしない木馬に頼った単細胞生物",
                    "トロイ: はあ、出来の悪すぎる部下を持ったな、まあすぐ死ぬだろうしいいか",
                    "トロイ: いけ、リアル=モニトハック"
                ]);
            }
            else if (bossId === 3000) {
                storyProgress = 11;
                killCount = 3000;
                saveGame();
                updateEnvironmentDisplay();
                messageEl.innerHTML = "🎉 リアル=モニトハックを撃破した！！";
            }
        }

        function triggerStory(dialogues) {
            isStoryPlaying = true;
            messageEl.textContent = "⚠️ 内部通信の傍受中……";

            storyOverlay.style.display = 'flex';
            setTimeout(() => { storyOverlay.style.opacity = '1'; }, 50);

            let index = 0;
            storyTextEl.textContent = dialogues[index];

            const dialogueInterval = setInterval(() => {
                index++;
                if (index < dialogues.length) {
                    storyTextEl.textContent = dialogues[index];
                } else {
                    clearInterval(dialogueInterval);
                    endStory();
                }
            }, 3000);
        }

        function endStory() {
            storyOverlay.style.opacity = '0';
            setTimeout(() => {
                storyOverlay.style.display = 'none';
                isStoryPlaying = false;
                messageEl.textContent = `🔥 次の目標に向けて戦闘再開！`;
                updateDisplay();
            }, 800);
        }

        function resetData() {
            if (confirm("本当にデータを初期化しますか？")) {
                localStorage.clear();
                location.reload();
            }
        }
    </script>
</body>
</html>
